backend: duckdb

warehouse:
  path: artefacts/local.duckdb

artefacts_dir: artefacts

schemas:
  synth: THESIS_SYNTH
  ops: CHURN_OPS

contract_path: config/source_contract.yaml

scoring:
  active_statuses: [ACTIVE, PAUSED, PAST_DUE]

label:
  horizon_days: 30

synth:
  seed: 20250630
  end_date: "2025-06-30"
  history_months: 24
  scales:
    tiny: 1500
    small: 30000
    default: 350000
    full: 350000

model:
  seed: 7
  min_history_days: 60
  calibration_share: 0.25
  lightgbm:
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8

# A candidate is promoted when its holdout top-decile precision and PR-AUC stay within tolerance
# of the current model. More than min_new_outcomes closed treated outcomes since that model also
# marks a retrain as due. The weekly cron itself is the scheduler's.
retrain:
  min_new_outcomes: 100
  tolerance: 0.01

schedule:
  cron: "0 6 * * *"
  retrain_cron: "0 6 * * 1"

# Email copy. provider anthropic uses ANTHROPIC_API_KEY; openai uses OPENAI_API_KEY.
# No key means every email stays on its template. Keys are never read from this file.
llm:
  provider: anthropic
  model: claude-haiku-4-5
  max_calls_per_run: 2000
  concurrency: 8
  timeout_s: 20
  max_subject_chars: 140
  max_body_chars: 2000
  retries: 3
