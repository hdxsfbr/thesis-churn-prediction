# Seed values for CHURN_OPS.AGENT_CONFIG (ARCHITECTURE A6/A7). `churn bootstrap` inserts keys that are
# missing and never overwrites edits; after that the table is the source of truth (editable in Metabase).
tiers:
  # Lower bound of each tier: low < medium <= p < high <= p < critical.
  boundaries:
    medium: 0.20
    high: 0.45
    critical: 0.70
  at_risk_from: medium

gate:
  # needs_approval = risk >= t_risk or cost >= t_cost_usd or discount_pct >= t_discount_pct or type in always_approve
  t_risk: 0.85
  t_cost_usd: 15
  t_discount_pct: 20
  always_approve: []

guardrails:
  contact_cap_14d: 1
  contact_cap_90d: 3
  max_discount_pct: 25
  offer_catalogue: [FREE_SHIPPING, PCT_10_NEXT, PCT_20_NEXT, PCT_25_NEXT_2, FREE_SAMPLE_BLEND]
  approval_expiry_h: 72
  approval_grace_h: 24

holdout:
  share: 0.10
  salt_version: v1

policy:
  max_explore_share: 0.2
  low_confidence: 0.5
  unknown_email_reach: 0.5
  value_by_tenure: {'<90': 50, '90-365': 150, '>365': 400}
  priors:
    default:
      checkin_email: [20, 80]
      formulation: [10, 90]
      retention_offer: [10, 90]
      escalation: [5, 95]
    price_sensitive:
      checkin_email: [10, 90]
      formulation: [10, 90]
      retention_offer: [80, 20]
      escalation: [5, 95]
    efficacy_dissatisfied:
      checkin_email: [10, 90]
      formulation: [80, 20]
      retention_offer: [10, 90]
      escalation: [5, 95]
    fatigued:
      checkin_email: [80, 20]
      formulation: [10, 90]
      retention_offer: [10, 90]
      escalation: [5, 95]
    life_change:
      checkin_email: [50, 50]
      formulation: [5, 95]
      retention_offer: [5, 95]
      escalation: [60, 40]

outcomes:
  window_days: 30
  response_window_days: 7
