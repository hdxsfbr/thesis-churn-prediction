[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Churn prediction and intervention agent (Thesis)"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4",
  "sqlglot>=25",
  "pandas>=2.2",
  "pyarrow",
  "numpy",
  "scikit-learn>=1.6",
  "lightgbm>=4.3",
  "joblib",
  "pydantic>=2.6",
  "pyyaml",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.1"]

[project.scripts]
churn = "churn.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: medium-scale evaluation tests",
  "scale: full-scale timing tests",
  "snowflake: needs a live Snowflake account (SNOWFLAKE_* env)",
]
addopts = "-m 'not slow and not scale and not snowflake'"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/churn/cli.py" = ["B008"]
