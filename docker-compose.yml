services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["churn", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - churn-data:/app/artefacts
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["churn", "worker"]
    env_file: .env
    volumes:
      - churn-data:/app/artefacts
    restart: unless-stopped

volumes:
  churn-data:
