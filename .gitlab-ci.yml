image: python:3.12-slim

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - apt-get update -qq && apt-get install -y -qq libgomp1  # LightGBM runtime
  - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - ruff check src tests

test:
  stage: test
  script:
    - python -m pytest --junitxml=junit.xml
    - churn report-tests --junit junit.xml --output docs/test-results.md
  artifacts:
    when: always
    paths:
      - docs/test-results.md
    reports:
      junit: junit.xml
